<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="45%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2d0a4e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c026ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff2ecb"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- faint circuit grid -->
  <g stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="280"/>
    <line x1="1050" y1="0" x2="1050" y2="280"/>
  </g>

  <!-- neo-tribal mass, left side (filled tattoo-style flame/thorn shapes) -->
  <g filter="url(#lineGlow)">
    <path d="M 0 280 L 0 0 L 55 0 C 40 30, 65 55, 45 85 C 30 108, 55 125, 40 150 C 25 172, 50 190, 35 215 C 22 235, 45 250, 30 280 Z"
          fill="url(#glow)" opacity="0.9"/>
    <path d="M 55 0 C 75 20, 68 45, 92 60 C 112 72, 105 95, 128 108 C 118 112, 108 108, 98 98 C 80 82, 85 60, 65 42 C 52 28, 50 12, 55 0 Z"
          fill="url(#glow)" opacity="0.55"/>
    <path d="M 45 85 C 65 92, 78 78, 100 82 C 90 92, 92 105, 78 112 C 65 116, 55 105, 45 85 Z"
          fill="#ff2ecb" opacity="0.4"/>
    <path d="M 30 280 C 45 265, 60 268, 78 250 C 70 262, 74 274, 60 280 Z" fill="#c026ff" opacity="0.5"/>
  </g>

  <!-- neo-tribal mass, right side (mirrored) -->
  <g filter="url(#lineGlow)">
    <path d="M 1200 280 L 1200 0 L 1145 0 C 1160 30, 1135 55, 1155 85 C 1170 108, 1145 125, 1160 150 C 1175 172, 1150 190, 1165 215 C 1178 235, 1155 250, 1170 280 Z"
          fill="url(#glow)" opacity="0.9"/>
    <path d="M 1145 0 C 1125 20, 1132 45, 1108 60 C 1088 72, 1095 95, 1072 108 C 1082 112, 1092 108, 1102 98 C 1120 82, 1115 60, 1135 42 C 1148 28, 1150 12, 1145 0 Z"
          fill="url(#glow)" opacity="0.55"/>
    <path d="M 1155 85 C 1135 92, 1122 78, 1100 82 C 1110 92, 1108 105, 1122 112 C 1135 116, 1145 105, 1155 85 Z"
          fill="#ff2ecb" opacity="0.4"/>
    <path d="M 1170 280 C 1155 265, 1140 268, 1122 250 C 1130 262, 1126 274, 1140 280 Z" fill="#c026ff" opacity="0.5"/>
  </g>

  <!-- fine tribal linework accents -->
  <g fill="none" stroke="#f3e8ff" stroke-width="1.2" opacity="0.5">
    <path d="M 130 40 C 145 55, 140 70, 155 80"/>
    <path d="M 1070 40 C 1055 55, 1060 70, 1045 80"/>
  </g>
  <g fill="url(#glow)" opacity="0.85">
    <circle cx="150" cy="20" r="2.5"/>
    <circle cx="1050" cy="20" r="2.5"/>
  </g>

  <!-- title -->
  <text x="600" y="140" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="52" font-weight="700" fill="#f3e8ff" filter="url(#softGlow)" letter-spacing="4">JOÃO RABELO</text>
  <text x="600" y="140" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="52" font-weight="700" fill="none" stroke="#c026ff" stroke-width="0.6" letter-spacing="4">JOÃO RABELO</text>

  <!-- subtitle -->
  <text x="600" y="180" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#c4b5fd" letter-spacing="6">RED TEAM // OFFENSIVE SECURITY</text>

  <!-- divider glyphs -->
  <text x="600" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b5cf6" opacity="0.8" letter-spacing="3">[ recon ] — [ exploit ] — [ report ]</text>
</svg>
